review:
  # Empty: origin/HEAD, then main, then master.
  base: ""
  rules: [AGENTS.md, CLAUDE.md, .plait/rules.md]
  # Larger diffs drop whole files, biggest first.
  max_diff_bytes: 524288
  # Expected check names, e.g. [test, lint].
  checks: []
audit:
  deny_globs: ["**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/id_rsa*", "**/secrets/**", "**/*.p12", "**/*.keystore"]
mr:
  # Repository path to a custom text/template; empty uses the built-in one.
  template: ""
network:
  # PEM file with the corporate CA, added to the system pool; relative to the repository root. Empty: SSL_CERT_FILE.
  ca_file: ""
  # URLs plait doctor --net reaches besides the model endpoints, e.g. [https://gitlab.example.internal].
  endpoints: []
jira:
  # Only mcp: the agent fetches the task with its own Jira access and saves it with plait ctx save.
  mode: mcp
  # MCP tool the agent calls to get an issue; empty: any Jira access the agent has.
  mcp_tool: ""
# Agents in plait-agent/v1 by name: override a built-in one (claude, qwen) field by field,
# or describe a new one; base: <agent> takes another agent's fields first.
agents: {}
