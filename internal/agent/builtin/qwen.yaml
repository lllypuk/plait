name: qwen
display: Qwen Code
cmd: qwen
version_args: [--version]
skill_dirs: { user: ~/.qwen/skills, project: .qwen/skills }
context_file: QWEN.md
permissions:
  writer: qwen-settings
  user: ~/.qwen/settings.json
  project: .qwen/settings.json
  deny: [plait approve, plait reject]
  source: https://qwenlm.github.io/qwen-code-docs/en/users/configuration/settings/
telemetry_off:
  - json:
      file: ~/.qwen/settings.json
      path: privacy.usageStatisticsEnabled
      equals: false
      env: QWEN_USAGE_STATISTICS_ENABLED
model_endpoint_env: OPENAI_BASE_URL
